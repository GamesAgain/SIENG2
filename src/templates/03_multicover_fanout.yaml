# =============================================================================
# Template 3 — Three-Way Fan-Out & Decoy Layers
#
# Showcase: one encrypted file is fragmented across three PNG carriers. Each
# branch receives a different harmless-looking layer before delivery. This
# demonstrates multi-output Locomotive, output-slot routing, and a real DAG.
#
# Deliver all three final files. The recipient needs every file plus the
# receiver private key to reconstruct the original archive.
# =============================================================================
variables:
  SRC_IMG1: "d:/SRY-DEV/cs-project/Program/Doing/GUI/SIENG2/img/001.png"
  SRC_IMG2: "d:/SRY-DEV/cs-project/Program/Doing/GUI/SIENG2/img/002.png"
  SRC_IMG3: "d:/SRY-DEV/cs-project/Program/Doing/GUI/SIENG2/img/003.png"
  RECEIVER_PUB_KEY: "d:/SRY-DEV/cs-project/Program/Doing/GUI/SIENG2/yaml/data/pub_key.pem"
  SECRET_FILE: "d:/SRY-DEV/cs-project/Program/Doing/GUI/SIENG2/yaml/data/file1.txt"

  DECOY_LSB_TEXT: "Meeting notes: lunch at noon."
  DECOY_LSB_PASSWORD: "decoy-pass"
  DECOY_METADATA_NOTE: "Vacation photos — archive 2024"
  DECOY_LOCOMOTIVE_TEXT: "Transfer receipt: branch C verified."

workflows:
  embed:
    - step_id: "fragment_archive"
      module: "locomotive"
      guidenote: "เข้ารหัสไฟล์ลับด้วย public key แล้วกระจายลง carrier 3 ใบ ต้องมี output ครบทั้งสามใบจึงกู้ไฟล์ได้"
      inputs:
        covers:
          - ${{ variables.SRC_IMG1 }}
          - ${{ variables.SRC_IMG2 }}
          - ${{ variables.SRC_IMG3 }}
        file_payload:
          - ${{ variables.SECRET_FILE }}
        encryption:
          mode: "asymmetric"
          public_key: ${{ variables.RECEIVER_PUB_KEY }}
      outputs:
        stego_files:
          - "output/branch_a.png"
          - "output/branch_b.png"
          - "output/branch_c.png"

    - step_id: "decoy_message_branch_a"
      module: "lsbpp"
      guidenote: "เติมข้อความลวงที่เข้ารหัสบน carrier สาย A เพื่อแสดงการต่อ output slot ไปยัง LSB++"
      inputs:
        covers:
          - ${{ steps.fragment_archive.outputs.stego_files[0] }}
        text_payload: ${{ variables.DECOY_LSB_TEXT }}
        encryption:
          mode: "symmetric"
          password: ${{ variables.DECOY_LSB_PASSWORD }}
      outputs:
        stego_file: "output/branch_a_final.png"

    - step_id: "decoy_metadata_branch_b"
      module: "metadata"
      guidenote: "เติม metadata ลวงบน carrier สาย B เพื่อแสดงการต่อ output slot เดียวกันไปยัง Metadata-PNG"
      inputs:
        covers:
          - ${{ steps.fragment_archive.outputs.stego_files[1] }}
        meta_dict:
          note: ${{ variables.DECOY_METADATA_NOTE }}
        encryption: null
      outputs:
        stego_file: "output/branch_b_final.png"

    - step_id: "decoy_receipt_branch_c"
      module: "locomotive"
      guidenote: "ซ่อนข้อความใบรับส่งที่ไม่ลับบน carrier สาย C เพื่อแสดง Locomotive ซ้อนบน output อีกสายหนึ่ง"
      inputs:
        covers:
          - ${{ steps.fragment_archive.outputs.stego_files[2] }}
        text_payload: ${{ variables.DECOY_LOCOMOTIVE_TEXT }}
        encryption: null
      outputs:
        stego_files:
          - "output/branch_c_final.png"
